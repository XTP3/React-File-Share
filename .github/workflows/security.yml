name: V2 dependency security
on:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/Back-End/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
      - name: Scan reachable Go vulnerabilities
        working-directory: v2/Back-End
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Audit frontend and fixture lockfiles
        run: |
          npm audit --package-lock-only --audit-level=low --prefix v2/Front-End
          npm audit --package-lock-only --audit-level=low --prefix tests
          npm audit --package-lock-only --audit-level=low --prefix tests/browser
